site_name: libmpvKt
site_url: https://yuroyami.github.io/libmpvKt/
site_description: libmpv for Android as one Maven artifact.
site_author: yuroyami
copyright: Apache-2.0 wrapper, GPL binaries

repo_name: yuroyami/libmpvKt
repo_url: https://github.com/yuroyami/libmpvKt
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - theme/kite.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - The typed API: typed-api.md
  - Building the natives: building-natives.md
  - Releasing: releasing.md
  - Licensing: licensing.md
  - API reference: https://yuroyami.github.io/libmpvKt/api/
