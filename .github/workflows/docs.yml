# Builds the MkDocs site and the Dokka API reference. A push validates them; only a hand-started
# run deploys to GitHub Pages (https://yuroyami.github.io/libmpvKt/), so an unpublished main
# never replaces the public docs. Pages must be set to "GitHub Actions" in the repository settings.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle.properties'
      - 'dokka-templates/**'
      - '.github/workflows/docs.yml'
  # A pull request builds the site too, so a broken page or a dependency bump fails before merge.
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle.properties'
      - 'dokka-templates/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# The build job runs pip and third-party Gradle plugins, so it gets read access only.
permissions:
  contents: read

# One queue per event and ref. Only the deploy job uses the pages group, so a push can no longer
# cancel a deploy that is waiting.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict --site-dir site
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the API reference into the site
        run: |
          ./gradlew dokkaGenerate --no-configuration-cache --stacktrace
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
