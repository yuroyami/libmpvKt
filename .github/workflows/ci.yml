# Every push and pull request: the gate, the natives, the AAR, and the device tests on an emulator.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull request runs replace each other. A run on main finishes, so an uncached native build is not lost.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: host tests, ABI dump, build logic, dash scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testAndroidHostTest checkKotlinAbi --stacktrace
      - run: ./gradlew -p buildSrc test --stacktrace
      - name: No em dashes or en dashes in tracked files
        run: |
          if git grep -n -I -e "$(printf '\342\200\224')" -e "$(printf '\342\200\223')" -- . ; then
            echo "::error::an em dash or an en dash is in a tracked file"; exit 1
          fi

  natives:
    uses: ./.github/workflows/build-natives.yml

  aar:
    name: AAR and sample
    needs: [gate, natives]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: dist
          merge-multiple: true
      - name: Put the libraries in place through the same path a release uses
        run: LIBMPVKT_NATIVES_BASE="file://$PWD/dist" .github/scripts/fetch-natives.sh local
      # assembleRelease runs R8 over every AAR with its published consumer rules.
      - run: ./gradlew :libmpvkt-native:checkNativeLibs :libmpvkt-canvas:checkRenderLib bundleAndroidMainAar :sample:assembleDebug :sample:assembleRelease --stacktrace
      # The publish path, unsigned, into build/static-maven: a broken POM or javadoc jar fails here, not on release day.
      - run: ./gradlew publishAllPublicationsToStaticRepository --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: libmpvkt-aars
          path: "**/build/outputs/aar/*.aar"
          if-no-files-found: error
          retention-days: 7

  emulator:
    name: device tests on API ${{ matrix.api }}
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 35 exercises the canvas renderer's zero-copy path (Bitmap.wrapHardwareBuffer, API 29+).
        # 28 is the only way to exercise its readback path, which no current phone can reach.
        # 21 is the core AARs' minSdk. The canvas module starts at 26, so it sits that one out.
        include:
          - api: 35
            tasks: connectedAndroidTest
          - api: 28
            tasks: connectedAndroidTest
          - api: 21
            tasks: ":libmpvkt-native:connectedAndroidTest :libmpvkt:connectedAndroidTest :libmpvkt-view:connectedAndroidTest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: natives-x86_64
          path: dist
      - run: LIBMPVKT_NATIVES_BASE="file://$PWD/dist" .github/scripts/fetch-natives.sh local x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew ${{ matrix.tasks }} -Plibmpvkt.abis=x86_64 --stacktrace || echo "TESTS_FAILED" > tests-failed
            adb logcat -d -s libmpvKt:I mpv:W > canvas-measurements.txt
            grep -c CANVAS-MEASUREMENT canvas-measurements.txt || true
            test ! -f tests-failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report-api-${{ matrix.api }}
          path: |
            **/build/reports/androidTests
            canvas-measurements.txt
          if-no-files-found: warn
