# Publishes the AAR to the static Maven repository: a checkout of yuroyami/maven, which GitHub
# Pages serves at https://yuroyami.github.io/maven/. Started by hand.
#
# The libraries are NOT built here. They are downloaded from the GitHub release named by the
# version, checksum verified, and checked by checkNativeLibs before the AAR is assembled. Run
# "Release natives" for v<version> first.
#
# A version directory that already exists in yuroyami/maven stops the run before anything is
# written: a published version is never overwritten. Publish a new version instead.
#
# Secrets: MAVEN_REPO_TOKEN (a fine-grained personal access token with contents read and write
# on yuroyami/maven), SIGNING_IN_MEMORY_KEY, SIGNING_IN_MEMORY_KEY_ID and
# SIGNING_IN_MEMORY_KEY_PASSWORD (an ASCII-armored GPG key, its id, its passphrase; the same
# three the Kite repositories use).
#
# Publishing from the maintainer's machine works the same way:
#   git clone https://github.com/yuroyami/maven ../maven
#   ./gradlew publishAllPublicationsToStaticRepository -Plibmpvkt.mavenRepoDir=$PWD/../maven --no-configuration-cache
#   cd ../maven && git add . && git commit -m "libmpvKt <version>" && git push
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match VERSION in gradle.properties), e.g. 0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  check-version:
    name: input matches gradle.properties and the changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The tag, not the branch head: Release natives built the zips from this commit.
      - uses: actions/checkout@v7
        with:
          ref: v${{ github.event.inputs.version }}
      - name: Assert version match
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version must look like 1.2.3, not $VERSION" >&2
            exit 1
          fi
          gradle_version="$(grep '^VERSION=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "${gradle_version}" != "${VERSION}" ]; then
            echo "::error::gradle.properties has VERSION=${gradle_version} but the run asked for ${VERSION}" >&2
            exit 1
          fi
          # A dated heading: '## [x.y.z] - unreleased' is not a release yet.
          if ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [${VERSION}] - YYYY-MM-DD' section; write the notes before publishing" >&2
            exit 1
          fi
          echo "Publishing ${VERSION}"

  publish:
    name: AAR to yuroyami/maven
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The same tagged commit whose natives the next steps download, so Kotlin and C++ match.
      - uses: actions/checkout@v7
        with:
          ref: v${{ github.event.inputs.version }}

      # The repository the artifacts land in. The token is not kept in the checkout's git config:
      # the Gradle build below runs third-party plugins, and only the push step needs to write.
      - uses: actions/checkout@v7
        with:
          repository: yuroyami/maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: maven-repo
          persist-credentials: false

      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # Every artifact one version publishes, each with its -android variant.
          for artifact in libmpvkt-native libmpvkt-native-android libmpvkt libmpvkt-android libmpvkt-view libmpvkt-view-android libmpvkt-compose libmpvkt-compose-android libmpvkt-canvas libmpvkt-canvas-android; do
            dir="maven-repo/io/github/yuroyami/$artifact/$VERSION"
            if [ -e "$dir" ]; then
              echo "::error::$dir exists; a published version is never overwritten. Publish a new version." >&2
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the release's native libraries
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: .github/scripts/fetch-natives.sh "v$VERSION"

      # A missing secret reads as empty, and the build would then publish unsigned for good,
      # because a published version is never replaced.
      - name: Refuse to publish unsigned
        env:
          KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          KEY_ID: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          for v in KEY KEY_ID KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::the signing secret behind $v is empty" >&2
              exit 1
            fi
          done

      - name: Check them and publish into the checkout
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          ./gradlew :libmpvkt-native:checkNativeLibs publishAllPublicationsToStaticRepository \
            -Plibmpvkt.mavenRepoDir="$PWD/maven-repo" --no-configuration-cache --stacktrace

      - name: Show what will be pushed, and refuse unsigned files
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          cd maven-repo
          git status --short
          du -sh io/github/yuroyami
          unsigned="$(find io/github/yuroyami -path "*/$VERSION/*" \( -name '*.aar' -o -name '*.jar' -o -name '*.pom' -o -name '*.module' \) ! -exec test -e '{}.asc' \; -print)"
          if [ -n "$unsigned" ]; then
            echo "::error::these files have no signature: $unsigned" >&2
            exit 1
          fi

      # The only step that writes to yuroyami/maven, and the only one that sees its token.
      - name: Push
        env:
          VERSION: ${{ github.event.inputs.version }}
          TOKEN: ${{ secrets.MAVEN_REPO_TOKEN }}
        run: |
          cd maven-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "libmpvKt $VERSION"
          git push "https://x-access-token:${TOKEN}@github.com/yuroyami/maven.git" HEAD:main
