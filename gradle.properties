#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

#Android
android.useAndroidX=true

#Dokka (v2 generator, aggregated API site at build/dokka/html)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#Library coordinates
GROUP=io.github.yuroyami
VERSION=0.2.0
DESCRIPTION=The typed Kotlin API for libmpv on Android: Mpv, one class per mpv core. It brings libmpvkt-native, which holds mpv, FFmpeg, libass, dav1d and their dependencies, prebuilt for arm64-v8a, armeabi-v7a, x86 and x86_64. The native libraries are GPL.
